<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
</head>

<body>
  <h1>用户登录</h1>

  <input id="email" type="email" placeholder="邮箱">
  <input id="password" type="password" placeholder="密码">

  <button id="signup">注册</button>
  <button id="signin">登录</button>
  <button id="signout">退出</button>

  <p id="message"></p>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabaseUrl = "https://zckpkhktthgwzcnumadb.supabase.co";
    const supabaseKey = "sb_publishable_fEMwadF6BygFMuGxdt2eBA_euB38tR4";

    const client = createClient(supabaseUrl, supabaseKey);

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const message = document.getElementById("message");

    document.getElementById("signup").onclick = async () => {
      const { error } = await client.auth.signUp({
        email: email.value,
        password: password.value
      });

      message.textContent = error
        ? error.message
        : "注册成功，请前往邮箱确认账号";
    };

    document.getElementById("signin").onclick = async () => {
      const { data, error } =
        await client.auth.signInWithPassword({
          email: email.value,
          password: password.value
        });

      message.textContent = error
        ? error.message
        : `登录成功：${data.user.email}`;
    };

    document.getElementById("signout").onclick = async () => {
      const { error } = await client.auth.signOut();

      message.textContent = error
        ? error.message
        : "已退出登录";
    };

    const {
      data: { session }
    } = await client.auth.getSession();

    if (session) {
      message.textContent = `当前登录用户：${session.user.email}`;
    }
  </script>
</body>
</html>
