<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>登录 · 我的生平</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }

    h1,
    h2 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      color: white;
      background: #246bfd;
    }

    button:hover {
      opacity: 0.85;
    }

    #signout {
      display: none;
    }

    #saveProfile {
      width: 100%;
      background: #159455;
    }

    .message {
      min-height: 24px;
      margin-top: 16px;
      word-break: break-word;
      color: #333333;
    }

    .profile {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #dddddd;
    }

    .user-email {
      margin-bottom: 16px;
      color: #666666;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>用户登录</h1>

    <div id="authForm">
      <input
        id="email"
        type="email"
        placeholder="请输入邮箱"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="请输入密码（至少6位）"
        autocomplete="current-password"
      >

      <div class="buttons">
        <button id="signup" type="button">注册</button>
        <button id="signin" type="button">登录</button>
        <button id="signout" type="button">退出登录</button>
      </div>
    </div>

    <p id="authMessage" class="message"></p>

    <section id="profileSection" class="profile" hidden>
      <h2>个人资料</h2>

      <p id="currentUserEmail" class="user-email"></p>

      <input
        id="nickname"
        type="text"
        placeholder="请输入昵称"
      >

      <button id="saveProfile" type="button">
        保存昵称
      </button>

      <p id="profileMessage" class="message"></p>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    /*
      这里只能填写：
      1. Project URL
      2. Publishable key

      不要填写 Secret key。
    */
    const supabaseUrl = "https://zckpkhktthgwzcnumadb.supabase.co";
    const supabaseKey = "sb_publishable_fEMwadF6BygFMuGxdt2eBA_euB38tR4";

    const supabase = createClient(
      supabaseUrl,
      supabaseKey,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    function safeNextUrl() {
      return new URL("../", window.location.href);
    }

    function redirectAfterLogin() {
      window.location.replace(safeNextUrl().href);
    }

    function emailConfirmationUrl() {
      return new URL("./", window.location.href).href;
    }

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const authMessage =
      document.getElementById("authMessage");

    const profileSection =
      document.getElementById("profileSection");

    const currentUserEmail =
      document.getElementById("currentUserEmail");

    const nicknameInput =
      document.getElementById("nickname");

    const profileMessage =
      document.getElementById("profileMessage");

    let currentUser = null;

    function showAuthMessage(text, isError = false) {
      authMessage.textContent = text;
      authMessage.style.color =
        isError ? "#d93025" : "#159455";
    }

    function showProfileMessage(text, isError = false) {
      profileMessage.textContent = text;
      profileMessage.style.color =
        isError ? "#d93025" : "#159455";
    }

    async function loadProfile() {
      if (!currentUser) {
        return;
      }

      const { data, error } = await supabase
        .from("profiles")
        .select("nickname")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (error) {
        showProfileMessage(error.message, true);
        return;
      }

      nicknameInput.value =
        data?.nickname ?? "";
    }

    async function refreshLoginStatus() {
      const {
        data: { session },
        error
      } = await supabase.auth.getSession();

      if (error) {
        showAuthMessage(error.message, true);
        return;
      }

      if (!session) {
        currentUser = null;
        profileSection.hidden = true;
        showAuthMessage("请登录后继续");
        return;
      }

      currentUser = session.user;
      showAuthMessage("登录状态有效，正在返回……");
      redirectAfterLogin();
    }

    /*
      注册
    */
    document
      .getElementById("signup")
      .addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAuthMessage(
            "请输入邮箱和密码",
            true
          );
          return;
        }

        if (password.length < 6) {
          showAuthMessage(
            "密码至少需要6位",
            true
          );
          return;
        }

        showAuthMessage("正在注册……");

        const { data, error } =
          await supabase.auth.signUp({
            email,
            password,

            options: {
              emailRedirectTo: emailConfirmationUrl()
            }
          });

        if (error) {
          showAuthMessage(error.message, true);
          return;
        }

        if (data.session) {
          redirectAfterLogin();
          return;
        }

        showAuthMessage("注册邮件已发送，请打开邮箱完成确认");
      });

    /*
      登录
    */
    document
      .getElementById("signin")
      .addEventListener("click", async () => {
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showAuthMessage(
            "请输入邮箱和密码",
            true
          );
          return;
        }

        showAuthMessage("正在登录……");

        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          showAuthMessage(error.message, true);
          return;
        }

        passwordInput.value = "";
        currentUser = data.user;
        showAuthMessage("登录成功，正在返回……");
        redirectAfterLogin();
      });

    /*
      退出登录
    */
    document
      .getElementById("signout")
      .addEventListener("click", async () => {
        const { error } =
          await supabase.auth.signOut();

        if (error) {
          showAuthMessage(error.message, true);
          return;
        }

        currentUser = null;
        nicknameInput.value = "";
        profileSection.hidden = true;

        showAuthMessage("已退出登录");
      });

    /*
      保存昵称
    */
    document
      .getElementById("saveProfile")
      .addEventListener("click", async () => {
        if (!currentUser) {
          showProfileMessage(
            "请先登录",
            true
          );
          return;
        }

        const nickname =
          nicknameInput.value.trim();

        if (!nickname) {
          showProfileMessage(
            "请输入昵称",
            true
          );
          return;
        }

        showProfileMessage("正在保存……");

        const { error } = await supabase
          .from("profiles")
          .upsert(
            {
              id: currentUser.id,
              nickname
            },
            {
              onConflict: "id"
            }
          );

        if (error) {
          showProfileMessage(
            error.message,
            true
          );
          return;
        }

        showProfileMessage("昵称保存成功");
      });

    /*
      页面打开时检查是否已经登录
    */
    passwordInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        document.getElementById("signin").click();
      }
    });

    supabase.auth.onAuthStateChange((_event, session) => {
      if (session) redirectAfterLogin();
    });

    await refreshLoginStatus();
  </script>
</body>
</html>
