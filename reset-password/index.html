<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eee7db">
  <meta name="description" content="设置新的登录密码。">
  <title>设置新密码</title>
  <style>
    :root{--paper:#eee7db;--white:#fffdf9;--ink:#18211f;--muted:#70766f;--green:#2e594d;--green-dark:#18342c;--green-soft:#e1ebe4;--orange:#b8472a;--line:rgba(24,33,31,.14);--danger:#aa3529;--shadow:0 32px 100px rgba(48,42,31,.16);--serif:"Noto Serif SC","Songti SC",SimSun,serif;--sans:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html{min-width:320px}body{min-height:100vh;margin:0;overflow-x:hidden;color:var(--ink);background:var(--paper);font-family:var(--sans)}body:before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;opacity:.32;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E")}button,input{font:inherit}button,a{color:inherit;-webkit-tap-highlight-color:transparent}a{text-decoration:none}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid rgba(184,71,42,.24);outline-offset:3px}[hidden]{display:none!important}
    .backdrop{position:fixed;z-index:-2;inset:0;overflow:hidden;background:radial-gradient(circle at 16% 14%,rgba(255,255,255,.92),transparent 26rem),radial-gradient(circle at 83% 22%,rgba(184,71,42,.13),transparent 25rem),radial-gradient(circle at 74% 86%,rgba(46,89,77,.15),transparent 31rem),linear-gradient(140deg,#f8f4ec 0%,#eee7da 56%,#e7ddce 100%)}.orb{position:absolute;border-radius:50%}.orb.one{width:330px;height:330px;right:-80px;top:-110px;border:70px solid rgba(184,71,42,.08)}.orb.two{width:460px;height:460px;left:-220px;bottom:-270px;background:rgba(46,89,77,.08)}.sweep{position:absolute;left:12%;right:7%;bottom:-43%;height:72%;border-radius:50% 50% 0 0;background:linear-gradient(105deg,rgba(46,89,77,.1),rgba(255,255,255,.04));transform:rotate(-5deg)}
    .timeline-art{position:absolute;left:clamp(35px,8vw,140px);top:23%;bottom:16%;width:190px;color:rgba(24,33,31,.4)}.timeline-art:before{content:"";position:absolute;top:0;bottom:0;left:18px;width:1px;background:linear-gradient(transparent,var(--green),var(--orange),transparent)}.time-point{position:absolute;left:12px;width:13px;height:13px;border:3px solid var(--paper);border-radius:50%;background:var(--green);box-shadow:0 0 0 1px var(--green)}.time-point span{position:absolute;left:28px;top:-5px;width:125px;font:500 13px var(--serif);letter-spacing:.12em}.time-point.first{top:8%}.time-point.second{top:46%;background:var(--orange);box-shadow:0 0 0 1px var(--orange)}.time-point.third{bottom:8%}
    main{min-height:100vh;display:grid;place-items:center;padding:54px 20px 80px}.card{width:min(460px,100%);padding:46px 50px 38px;border:1px solid rgba(24,33,31,.07);border-radius:8px;background:rgba(255,253,249,.92);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.head{text-align:center}.head h1{margin:0;font:500 32px/1.25 var(--serif);letter-spacing:.03em}.head p{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.75}
    .form{display:grid;gap:14px;margin-top:30px}.field{display:grid;gap:7px}.field>span:first-child{color:var(--muted);font-size:11px}.field input{width:100%;height:54px;padding:0 17px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:rgba(255,255,255,.82);outline:0;transition:.2s}.field input::placeholder{color:#a5aaa6}.field input:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(46,89,77,.08)}.password-wrap{position:relative}.password-wrap input{padding-right:58px}.password-toggle{position:absolute;right:8px;top:9px;width:38px;height:36px;display:grid;place-items:center;padding:0;border:0;border-radius:3px;color:var(--muted);background:transparent;cursor:pointer}.password-toggle:hover,.password-toggle.is-pressed{color:var(--green);background:var(--green-soft)}.password-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .primary{width:100%;height:52px;margin-top:7px;border:0;border-radius:5px;color:#fff;background:var(--green);box-shadow:0 12px 28px rgba(46,89,77,.19);cursor:pointer;font-size:15px;font-weight:700;letter-spacing:.06em;transition:.2s}.primary:hover{transform:translateY(-2px);background:var(--green-dark)}.primary:disabled{opacity:.58;cursor:wait;transform:none}.secondary{width:100%;height:44px;border:0;color:var(--muted);background:transparent;cursor:pointer;font-size:11px}.secondary:hover{color:var(--orange)}.message{min-height:19px;margin:12px 0 0;color:var(--green);font-size:11px;line-height:1.65;text-align:center;overflow-wrap:anywhere}.message.error{color:var(--danger)}
    .checking,.invalid{min-height:310px;display:grid;place-items:center;text-align:center}.spinner{width:40px;height:40px;margin:0 auto 20px;border:3px solid rgba(24,33,31,.1);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}.checking strong,.invalid h1{font:500 24px var(--serif)}.checking p,.invalid p{margin:9px 0 0;color:var(--muted);font-size:11px;line-height:1.75}.invalid h1{margin:0}.invalid-actions{display:grid;gap:9px;margin-top:24px}.invalid-actions a{display:grid;place-items:center;height:48px;border-radius:5px;color:#fff;background:var(--green);font-size:13px;font-weight:700}.invalid-actions a+a{height:auto;padding:9px;color:var(--muted);background:transparent;font-size:11px;font-weight:400}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:700px){.timeline-art{display:none}main{padding:26px 14px 48px}.card{padding:36px 23px 30px}.head h1{font-size:29px}.form{margin-top:25px}.field input{height:52px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"><span class="orb one"></span><span class="orb two"></span><span class="sweep"></span><div class="timeline-art"><div class="time-point first"><span>验证链接</span></div><div class="time-point second"><span>设置密码</span></div><div class="time-point third"><span>重新登录</span></div></div></div>
  <main>
    <section class="card">
      <div class="checking" id="checkingView" aria-live="polite"><div><div class="spinner" aria-hidden="true"></div><strong>正在验证重置链接</strong><p>请稍候，不要关闭页面。</p></div></div>

      <div id="resetView" hidden>
        <header class="head"><h1>设置新密码</h1><p>请输入新密码并再次确认，保存后即可重新登录。</p></header>
        <form class="form" id="resetForm">
          <label class="field"><span>新密码</span><span class="password-wrap"><input id="newPassword" type="password" placeholder="请输入至少 6 位新密码" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" data-password-target="newPassword" aria-label="按住查看密码" title="按住查看密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.6"></circle></svg></button></span></label>
          <label class="field"><span>确认新密码</span><span class="password-wrap"><input id="confirmPassword" type="password" placeholder="请再次输入新密码" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" data-password-target="confirmPassword" aria-label="按住查看密码" title="按住查看密码"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Z"></path><circle cx="12" cy="12" r="2.6"></circle></svg></button></span></label>
          <button class="primary" id="saveButton" type="submit">保存新密码</button>
          <button class="secondary" id="cancelButton" type="button">取消并返回登录</button>
        </form>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </div>

      <div class="invalid" id="invalidView" hidden>
        <div><h1>重置链接不可用</h1><p id="invalidMessage">链接可能已经使用过或已经过期，请重新发送密码重置邮件。</p><div class="invalid-actions"><a href="../login/">返回登录页面</a><a href="../login/">重新找回密码</a></div></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://zckpkhktthgwzcnumadb.supabase.co",
      "sb_publishable_fEMwadF6BygFMuGxdt2eBA_euB38tR4",
      { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
    );

    const checkingView = document.getElementById("checkingView");
    const resetView = document.getElementById("resetView");
    const invalidView = document.getElementById("invalidView");
    const message = document.getElementById("message");
    const saveButton = document.getElementById("saveButton");
    let formReady = false;

    function loginUrl(success = false) {
      const url = new URL("../login/", window.location.href);
      if (success) url.searchParams.set("reset", "success");
      return url.href;
    }

    function showResetForm() {
      formReady = true;
      checkingView.hidden = true;
      invalidView.hidden = true;
      resetView.hidden = false;
      requestAnimationFrame(() => document.getElementById("newPassword").focus());
    }

    function showInvalid(text = "链接可能已经使用过或已经过期，请重新发送密码重置邮件。") {
      if (formReady) return;
      checkingView.hidden = true;
      resetView.hidden = true;
      invalidView.hidden = false;
      document.getElementById("invalidMessage").textContent = text;
    }

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
    }

    function setBusy(busy) {
      saveButton.disabled = busy;
      saveButton.textContent = busy ? "正在保存……" : "保存新密码";
    }

    const passwordButtons = [...document.querySelectorAll("[data-password-target]")];

    function revealPassword(button) {
      document.getElementById(button.dataset.passwordTarget).type = "text";
      button.classList.add("is-pressed");
      button.setAttribute("aria-label", "松开隐藏密码");
    }

    function concealPassword(button) {
      document.getElementById(button.dataset.passwordTarget).type = "password";
      button.classList.remove("is-pressed");
      button.setAttribute("aria-label", "按住查看密码");
    }

    function concealAllPasswords() {
      passwordButtons.forEach(concealPassword);
    }

    passwordButtons.forEach(button => {
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        revealPassword(button);
      });
      button.addEventListener("pointerleave", () => concealPassword(button));
      button.addEventListener("pointercancel", () => concealPassword(button));
      button.addEventListener("click", event => {
        event.preventDefault();
        concealPassword(button);
      });
      button.addEventListener("keydown", event => {
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          revealPassword(button);
        }
      });
      button.addEventListener("keyup", event => {
        if (event.key === " " || event.key === "Enter") concealPassword(button);
      });
      button.addEventListener("blur", () => concealPassword(button));
    });

    document.addEventListener("pointerup", concealAllPasswords);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) concealAllPasswords();
    });
    window.addEventListener("blur", concealAllPasswords);

    document.getElementById("resetForm").addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;
      if (password !== confirmation) {
        showMessage("两次输入的新密码不一致", true);
        document.getElementById("confirmPassword").focus();
        return;
      }
      setBusy(true);
      showMessage("");
      const { error } = await supabase.auth.updateUser({ password });
      if (error) {
        setBusy(false);
        showMessage(error.message.toLowerCase().includes("password") ? "新密码不符合安全要求，请更换后重试" : "密码保存失败，请重新打开重置邮件", true);
        return;
      }
      const { error: signOutError } = await supabase.auth.signOut({ scope: "local" });
      if (signOutError) {
        setBusy(false);
        showMessage("密码已更新，但临时会话未能退出，请刷新后重新登录", true);
        return;
      }
      window.location.replace(loginUrl(true));
    });

    document.getElementById("cancelButton").addEventListener("click", async () => {
      await supabase.auth.signOut({ scope: "local" });
      window.location.replace(loginUrl());
    });

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) showResetForm();
    });

    async function initializeResetPage() {
      const hash = new URLSearchParams(window.location.hash.slice(1));
      const query = new URLSearchParams(window.location.search);
      if (hash.get("error") || query.get("error")) {
        showInvalid(hash.get("error_description") || query.get("error_description") || "重置链接无效或已过期，请重新发送");
        return;
      }
      const tokenHash = query.get("token_hash");
      if (tokenHash) {
        const { data, error } = await supabase.auth.verifyOtp({ type: "recovery", token_hash: tokenHash });
        if (error || !data.session) {
          showInvalid("重置链接无效或已过期，请重新发送密码重置邮件。");
          return;
        }
        window.history.replaceState({}, "", new URL("./", window.location.href).href);
        showResetForm();
        return;
      }
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error) {
        showInvalid("暂时无法验证重置链接，请检查网络后重试");
        return;
      }
      if (!session) {
        showInvalid();
        return;
      }
      showResetForm();
    }

    await initializeResetPage();
  </script>
</body>
</html>
